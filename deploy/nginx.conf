server {
  listen 80;
  root /usr/share/nginx/html;
  # Never inside another site's frame (protects the Claude connector's Allow button from clickjacking).
  add_header Content-Security-Policy "frame-ancestors 'none'" always;
  add_header X-Frame-Options DENY always;

  # The API runs as the "api" service in docker-compose.server.yml.
  location /api/ {
    proxy_pass http://api:4100;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Claude connector: MCP endpoint and OAuth sign-in (see docs/how-to/set-up-claude-connector.md).
  location ~ ^/(mcp|authorize|token|register|revoke)$ {
    proxy_pass http://api:4100;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location /.well-known/oauth- {
    proxy_pass http://api:4100;
    proxy_set_header Host $host;
  }

  # Client-side routes (/board, /teams, ...) all load the app.
  location / {
    try_files $uri /index.html;
  }
}
