name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: resource_board
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/resource_board?schema=public
      JWT_SECRET: ci-test-secret
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install (also runs prisma generate)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Apply migrations
        run: npm run db:deploy

      - name: Seed (smoke test)
        run: npm run db:seed
        env:
          NODE_ENV: development

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Install browser for end-to-end tests
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npx playwright test
        env:
          E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/resource_board_e2e?schema=public

      - name: Upload end-to-end report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Builds the server images and smoke-tests the whole stack (db + api + web behind nginx).
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      JWT_SECRET: ci-docker-secret
      COMPOSE: docker compose -f deploy/docker-compose.server.yml
    steps:
      - uses: actions/checkout@v4

      - name: Build and start
        run: $COMPOSE up -d --build

      - name: Seed
        run: $COMPOSE run --rm -e NODE_ENV=development api npm run db:seed -w @rb/api

      - name: Smoke test through nginx
        run: |
          for i in $(seq 1 30); do curl -sf http://localhost:8080/api/health && break; sleep 2; done
          curl -sf http://localhost:8080/ | grep -q 'id="root"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/projects)" = 401
          TOKEN=$(curl -sf -X POST http://localhost:8080/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"admin@resourceboard.local","password":"Admin@12345"}' | jq -r .token)
          curl -sf http://localhost:8080/api/dashboard/kpis -H "Authorization: Bearer $TOKEN" \
            | jq -e '.teamSize > 0'

      - name: Logs on failure
        if: failure()
        run: $COMPOSE logs --no-color
