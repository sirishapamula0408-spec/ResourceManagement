<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SedHub prototype</title>
<style>
  :root {
    --bg: #f4f6fb; --panel: #ffffff; --ink: #172b4d; --muted: #5b6785; --line: #dcdfe4;
    --accent: #0c66e4; --accent-soft: #e9f2ff; --hot: rgba(12, 102, 228, 0.18); --hot-line: #0c66e4;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; display: grid; grid-template-columns: 280px minmax(0, 1fr); }
  aside { background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; height: 100vh; position: sticky; top: 0; padding: 18px 14px; }
  aside h1 { font-size: 18px; margin: 0 0 2px; }
  aside p.sub { margin: 0 0 16px; color: var(--muted); font-size: 12px; }
  aside h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 16px 6px 6px; }
  aside a { display: block; padding: 6px 8px; border-radius: 4px; color: var(--ink); text-decoration: none; }
  aside a small { display: block; color: var(--muted); font-size: 11px; }
  aside a:hover { background: var(--bg); }
  aside a[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  aside a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  main { min-width: 0; padding: 16px 20px 40px; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; margin-bottom: 12px; }
  header h2 { margin: 0; font-size: 20px; }
  header .role { font-size: 12px; color: var(--accent); background: var(--accent-soft); padding: 2px 8px; border-radius: 999px; }
  header .note { flex-basis: 100%; margin: 0; color: var(--muted); }
  .spacer { flex: 1; }
  button { font: inherit; border: 1px solid transparent; background: #f1f2f4; color: #44546f; padding: 6px 12px; border-radius: 3px; cursor: pointer; }
  button:hover { background: #dcdfe4; }
  label.toggle { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; }
  .stage { position: relative; display: inline-block; max-width: 100%; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: #fff; box-shadow: 0 8px 30px rgba(16, 34, 94, .08); }
  .stage img { display: block; max-width: 100%; height: auto; }
  .stage a.hot { position: absolute; border-radius: 3px; outline: 0; }
  .stage.show a.hot, .stage.flash a.hot { background: var(--hot); box-shadow: inset 0 0 0 2px var(--hot-line); }
  .stage a.hot:hover, .stage a.hot:focus-visible { background: var(--hot); box-shadow: inset 0 0 0 2px var(--hot-line); }
  .help { color: var(--muted); font-size: 12px; margin-top: 10px; }
  kbd { border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 3px; padding: 0 4px; font-size: 11px; background: #fff; }
  @media (max-width: 800px) { body { grid-template-columns: 1fr; } aside { position: static; height: auto; } }
</style>
</head>
<body>
<aside>
  <h1>SedHub prototype</h1>
  <p class="sub">Clickable screens captured from the running app with sample data (generated 5 Nov 2026).</p>
  <nav id="list" aria-label="Screens"></nav>
</aside>
<main>
  <header>
    <h2 id="title"></h2>
    <span class="role" id="role"></span>
    <span class="spacer"></span>
    <label class="toggle"><input type="checkbox" id="show" /> Show clickable areas</label>
    <button type="button" id="prev" aria-label="Previous screen">← Prev</button>
    <button type="button" id="next" aria-label="Next screen">Next →</button>
    <p class="note" id="note"></p>
  </header>
  <div class="stage" id="stage"><img id="img" alt="" /></div>
  <p class="help">Click the highlighted areas to move between screens, as in the app. Click anywhere else to flash them. Keys: <kbd>←</kbd> <kbd>→</kbd> previous / next screen, <kbd>H</kbd> show clickable areas.</p>

const byId = Object.fromEntries(SCREENS.map((s) => [s.id, s]));
const list = document.getElementById('list');
const stage = document.getElementById('stage');
const img = document.getElementById('img');
const show = document.getElementById('show');
let current = SCREENS[0].id;

// Screen list, grouped.
let group = '';
for (const s of SCREENS) {
  if (s.group !== group) {
    group = s.group;
    const h = document.createElement('h2');
    h.textContent = group;
    list.append(h);
  }
  const a = document.createElement('a');
  a.href = '#' + s.id;
  a.dataset.id = s.id;
  a.innerHTML = '';
  a.append(s.title);
  const small = document.createElement('small');
  small.textContent = s.role;
  a.append(small);
  list.append(a);
}

function render(id) {
  const s = byId[id] || SCREENS[0];
  current = s.id;
  document.getElementById('title').textContent = s.title;
  document.getElementById('role').textContent = s.role;
  document.getElementById('note').textContent = s.note;
  img.src = 'screens/' + s.file;
  img.alt = s.title + ' screen';
  stage.querySelectorAll('a.hot').forEach((a) => a.remove());
  for (const h of s.hotspots) {
    const a = document.createElement('a');
    a.className = 'hot';
    a.href = '#' + h.to;
    a.title = h.label + ' → ' + (byId[h.to] ? byId[h.to].title : h.to);
    a.setAttribute('aria-label', a.title);
    a.style.left = (100 * h.x / s.width) + '%';
    a.style.top = (100 * h.y / s.height) + '%';
    a.style.width = (100 * h.w / s.width) + '%';
    a.style.height = (100 * h.h / s.height) + '%';
    stage.append(a);
  }
  list.querySelectorAll('a').forEach((a) => a.toggleAttribute('aria-current', a.dataset.id === s.id));
  list.querySelector('a[aria-current]')?.setAttribute('aria-current', 'page');
  list.querySelector('a[aria-current]')?.scrollIntoView({ block: 'nearest' });
  document.title = s.title + ' · SedHub prototype';
  window.scrollTo(0, 0);
}
function go(delta) {
  const i = SCREENS.findIndex((s) => s.id === current);
  location.hash = SCREENS[(i + delta + SCREENS.length) % SCREENS.length].id;
}
window.addEventListener('hashchange', () => render(location.hash.slice(1)));
document.getElementById('prev').onclick = () => go(-1);
document.getElementById('next').onclick = () => go(1);
show.onchange = () => stage.classList.toggle('show', show.checked);
stage.addEventListener('click', (e) => {
  if (e.target.closest('a.hot')) return;
  stage.classList.add('flash');
  setTimeout(() => stage.classList.remove('flash'), 600);
});
document.addEventListener('keydown', (e) => {
  if (e.target.matches('input, textarea')) return;
  if (e.key === 'ArrowRight') go(1);
  if (e.key === 'ArrowLeft') go(-1);
  if (e.key === 'h' || e.key === 'H') { show.checked = !show.checked; show.onchange(); }
});
render(location.hash.slice(1));
</script>
